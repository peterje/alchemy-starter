name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

# Never cancel a run mid-deploy: a stage half-created or half-destroyed leaves a database branch
# that the next run has to reclaim. A newer push waits for the current run instead.
concurrency:
  group: starter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}

jobs:
  verify:
    name: Verify
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Check formatting, lint, types, tests, and build
        run: bun run check
      - name: Check whitespace
        run: git diff --check

  database:
    name: Database
    if: github.event.action != 'closed'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Check credentials
        run: bun alchemy provider check-env --provider Cloudflare --provider Planetscale
      # Pull requests show what a database change would do; only a merge applies it.
      - name: Plan database changes
        if: github.event_name == 'pull_request'
        run: bun alchemy plan stacks/database.ts --stage shared
      - name: Deploy database changes
        if: github.event_name == 'push'
        run: bun alchemy deploy stacks/database.ts --stage shared --yes

  integration:
    name: Integration
    if: github.event.action != 'closed'
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      # The test stages are named after the user (`test_$USER`, `browser_$USER`), so runs for
      # different pull requests never share a stage or a database branch.
      USER: ci-${{ github.event.pull_request.number || 'main' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Worker, Durable Object, and Postgres integration suite
        run: bun run test:integration
      - name: Run browser integration suite
        run: bun run test:browser
      - name: Destroy the browser suite's stage
        if: always()
        run: bun alchemy destroy --stage "browser_$USER" --yes
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      # The stack comments the preview URL on this pull request.
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Check credentials
        run: bun alchemy provider check-env --provider Cloudflare --provider Planetscale --provider GitHub
      - name: Deploy the pull request's stage
        run: bun alchemy deploy --stage "$PREVIEW_STAGE" --yes

  cleanup:
    name: Destroy preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      TEST_USER: ci-${{ github.event.pull_request.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      # Test stages are normally destroyed by their own run; these catch any a failed run left.
      - name: Destroy the pull request's stages and database branches
        run: |
          bun alchemy destroy --stage "$PREVIEW_STAGE" --yes
          bun alchemy destroy --stage "test_$TEST_USER" --yes
          bun alchemy destroy --stage "browser_$TEST_USER" --yes

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: starter-production
      cancel-in-progress: false
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Check credentials
        run: bun alchemy provider check-env --provider Cloudflare --provider Planetscale
      - name: Deploy production stack
        run: bun alchemy deploy --stage prod --yes
